<!DOCTYPE html>
<html>
<head>
    <title>Limbic-Flow Dashboard</title>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font: 14px system-ui; background: #0d0d0d; color: #e5e5e5; padding: 20px; }
        h1 { color: #10a37f; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; }
        .card h3 { color: #888; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }
        .card .value { font-size: 24px; font-weight: bold; }
        .green { color: #10a37f; }
        .red { color: #ef4444; }
        .section { margin-top: 24px; }
        .section h2 { color: #fff; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #333; }
        th { color: #888; font-weight: normal; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Limbic-Flow Dashboard</h1>
    
    <div class="grid">
        <div class="card">
            <h3>CPU 使用率</h3>
            <div class="value" id="cpu">-</div>
        </div>
        <div class="card">
            <h3>内存使用</h3>
            <div class="value" id="memory">-</div>
        </div>
        <div class="card">
            <h3>请求数</h3>
            <div class="value" id="requests">-</div>
        </div>
    </div>
    
    <div class="section">
        <h2>配置</h2>
        <table>
            <tr><th>项</th><th>值</th></tr>
            <tr><td>LLM Provider</td><td id="llm">-</td></tr>
            <tr><td>情感模型</td><td id="emotion">-</td></tr>
            <tr><td>人格</td><td id="personality">-</td></tr>
        </table>
    </div>
    
    <script>
    async function loadStats() {
        try {
            const r = await fetch('/api/stats');
            const d = await r.json();
            document.getElementById('cpu').textContent = d.cpu + '%';
            document.getElementById('memory').textContent = d.memory + '%';
        } catch(e) {}
    }
    async function loadConfig() {
        try {
            const r = await fetch('/api/config');
            const d = await r.json();
            document.getElementById('llm').textContent = d.llm_provider || '-';
        } catch(e) {}
    }
    loadStats(); loadConfig();
    setInterval(loadStats, 5000);
    </script>
</body>
</html>
