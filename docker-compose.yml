version: '3.8'

services:
  api:
    build: .
    ports:
      - "8001:8001"
    environment:
      - LIMBIC_DEBUG=true
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - api
