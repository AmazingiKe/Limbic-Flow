<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limbic-Flow</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --accent: #0a84ff;
            --text-primary: #fff;
            --text-secondary: #8e8e93;
            --text-tertiary: #636366;
            --border: #38383a;
            --bubble-user: #0a84ff;
            --bubble-ai: #2c2c2e;
            --glass: rgba(255,255,255,0.1);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; }
        .gradient-bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 20% 20%, rgba(10,132,255,0.12) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(94,92,230,0.08) 0%, transparent 50%), var(--bg-primary); z-index: -1; }
        .app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; }
        
        /* Header */
        .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#ff9500,#ff6b00); display: flex; align-items: center; justify-content: center; font-size: 20px; animation: pulse-glow 3s ease-in-out infinite; }
        @keyframes pulse-glow { 0%,100%{box-shadow:0 0 20px rgba(255,149,0,0.3)} 50%{box-shadow:0 0 30px rgba(255,149,0,0.6)} }
        .header-title h1 { font-size: 18px; font-weight: 600; background: linear-gradient(135deg,#ff9500,#ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-title p { font-size: 12px; color: var(--text-secondary); }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--bg-tertiary); color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; }
        .icon-btn:hover { background: var(--accent); }
        
        /* Chat */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
        .message { display: flex; gap: 10px; animation: message-in 0.3s ease-out; max-width: 85%; }
        .message.user { flex-direction: row-reverse; margin-left: auto; }
        .message.ai { margin-right: auto; }
        @keyframes message-in { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .message-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .message.ai .message-avatar { background: linear-gradient(135deg,#ff9500,#ff6b00); }
        .message.user .message-avatar { background: linear-gradient(135deg,#30d158,#34c759); }
        .message-content { display: flex; flex-direction: column; gap: 4px; }
        .message.user .message-content { align-items: flex-end; }
        .message-bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; }
        .message.ai .message-bubble { background: var(--bubble-ai); border-top-left-radius: 6px; }
        .message.user .message-bubble { background: var(--bubble-user); border-top-right-radius: 6px; }
        .message-time { font-size: 10px; color: var(--text-tertiary); }
        
        /* Typing */
        .typing-indicator { display: flex; gap: 4px; padding: 16px 20px; background: var(--bubble-ai); border-radius: 20px; border-top-left-radius: 6px; }
        .typing-dot { width: 8px; height: 8px; background: var(--text-secondary); border-radius: 50%; animation: typing-bounce 1.4s ease-in-out infinite; }
        .typing-dot:nth-child(1){animation-delay:0s} .typing-dot:nth-child(2){animation-delay:0.2s} .typing-dot:nth-child(3){animation-delay:0.4s}
        @keyframes typing-bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
        
        /* Input */
        .input-container { padding: 16px 24px 24px; background: var(--bg-secondary); border-top: 1px solid var(--border); }
        .input-wrapper { display: flex; align-items: flex-end; gap: 12px; background: var(--bg-tertiary); border-radius: 24px; padding: 12px 16px; border: 1px solid var(--border); transition: 0.2s; }
        .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,0.15); }
        #input { flex: 1; background: 0; border: 0; color: var(--text-primary); font-size: 15px; resize: none; max-height: 120px; line-height: 1.5; outline: 0; }
        #input::placeholder { color: var(--text-tertiary); }
        .send-btn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: linear-gradient(135deg,#ff9500,#ff6b00); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .send-btn:hover { transform: scale(1.1); }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; right: -400px; width: 400px; height: 100vh; background: var(--bg-secondary); border-left: 1px solid var(--border); padding: 24px; transition: right 0.3s; z-index: 200; overflow-y: auto; }
        .sidebar.active { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .sidebar-header h2 { font-size: 20px; font-weight: 600; }
        .close-btn { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--bg-tertiary); color: var(--text-primary); cursor: pointer; font-size: 20px; }
        .close-btn:hover { background: var(--accent); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; visibility: hidden; transition: 0.3s; z-index: 150; }
        .overlay.active { opacity: 1; visibility: visible; }
        
        /* Welcome */
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; padding: 40px; }
        .welcome-icon { font-size: 72px; margin-bottom: 24px; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
        .welcome-title { font-size: 28px; font-weight: 600; margin-bottom: 12px; background: linear-gradient(135deg,#ff9500,#ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-subtitle { color: var(--text-secondary); font-size: 15px; max-width: 320px; line-height: 1.6; }
        
        /* Mood Tag */
        .mood-tag { position: fixed; left: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; }
        .mood-tag-item { padding: 8px 14px; background: var(--glass); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; font-size: 13px; color: var(--text-secondary); backdrop-filter: blur(10px); transition: 0.3s; cursor: default; }
        .mood-tag-item.active { background: var(--accent); color: #fff; transform: scale(1.05); }
        .mood-tag-item::before { content:''; width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
        .mood-tag-item.joy::before{background:#ffd60a} .mood-tag-item.sad::before{background:#64d2ff} .mood-tag-item.angry::before{background:#ff453a} .mood-tag-item.calm::before{background:#30d158} .mood-tag-item.excited::before{background:#ff9f0a} .mood-tag-item.bored::before{background:#8e8e93}
        
        /* Form */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .form-group select, .form-group input { width: 100%; padding: 12px 16px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); font-size: 14px; }
        .btn-save { width: 100%; padding: 14px; background: linear-gradient(135deg,#ff9500,#ff6b00); border: 0; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
        
        /* Emotion */
        .emotion-dashboard { display: flex; justify-content: center; }
        .emotion-card { padding: 20px; text-align: center; }
        .emotion-card-icon { font-size: 64px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    
    <!-- Left mood tags -->
    <div class="mood-tag" id="moodTag">
        <div class="mood-tag-item joy active" data-mood="joy">轻松</div>
        <div class="mood-tag-item sad" data-mood="sad">难过</div>
        <div class="mood-tag-item angry" data-mood="angry">生气</div>
        <div class="mood-tag-item calm" data-mood="calm">平静</div>
        <div class="mood-tag-item excited" data-mood="excited">兴奋</div>
        <div class="mood-tag-item bored" data-mood="bored">无聊</div>
    </div>
    
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="avatar" id="avatar">🦊</div>
                <div class="header-title">
                    <h1>Limbic-Flow</h1>
                    <p id="status-text">在线</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-emotion">💭</button>
                <button class="icon-btn" id="btn-settings">⚙️</button>
            </div>
        </header>
        
        <main class="chat-container" id="chat">
            <div class="welcome-screen" id="welcome">
                <div class="welcome-icon">🦊</div>
                <h2 class="welcome-title">Hey, it's me</h2>
                <p class="welcome-subtitle">What's on your mind?</p>
            </div>
        </main>
        
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="input" placeholder="发送消息..." rows="1"></textarea>
                <button class="send-btn" id="btn-send">➤</button>
            </div>
        </div>
    </div>
    
    <div class="overlay" id="overlay"></div>
    
    <!-- Settings Sidebar -->
    <aside class="sidebar" id="sidebar-settings">
        <div class="sidebar-header">
            <h2>设置</h2>
            <button class="close-btn" id="close-settings">✕</button>
        </div>
        <div class="form-group">
            <label>人格</label>
            <select id="personality">
                <option value="default">默认</option>
                <option value="gentle">温柔</option>
                <option value="playful">活泼</option>
                <option value="wise">智慧</option>
            </select>
        </div>
        <div class="form-group">
            <label>情绪模式</label>
            <select id="pathology">
                <option value="none">正常</option>
                <option value="depression">抑郁</option>
                <option value="alzheimer">阿尔茨海默</option>
                <option value="ptsd">PTSD</option>
                <option value="anxiety">焦虑</option>
                <option value="bipolar">双相</option>
            </select>
        </div>
        <div class="form-group">
            <label>LLM 提供商</label>
            <select id="llm-provider">
                <option value="mock">Mock</option>
                <option value="openai">OpenAI</option>
                <option value="deepseek">DeepSeek</option>
            </select>
        </div>
        <div class="form-group">
            <input type="text" id="llm-model" placeholder="模型名称 (如 gpt-4)">
        </div>
        <div class="form-group">
            <input type="password" id="llm-api-key" placeholder="API Key">
        </div>
        <button class="btn-save" id="save-config">保存</button>
    </aside>
    
    <!-- Emotion Sidebar -->
    <aside class="sidebar" id="sidebar-emotion">
        <div class="sidebar-header">
            <h2>我现在的状态</h2>
            <button class="close-btn" id="close-emotion">✕</button>
        </div>
        <div class="emotion-dashboard">
            <div class="emotion-card">
                <div class="emotion-card-icon" id="emotion-icon">😊</div>
            </div>
        </div>
    </aside>
    
    <script src="app.js"></script>
</body>
</html>
