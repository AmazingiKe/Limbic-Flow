<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limbic-Flow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=SF+Pro+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --accent: #0a84ff;
            --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 100%);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #636366;
            --border: #38383a;
            --success: #30d158;
            --bubble-user: #0a84ff;
            --bubble-ai: #2c2c2e;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* 主容器 */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        /* 左侧情感标签 */
        .mood-tag {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .mood-tag-item {
            padding: 8px 14px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: default;
        }

        .mood-tag-item.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .mood-tag-item::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .mood-tag-item.joy::before { background: #ffd60a; }
        .mood-tag-item.sad::before { background: #64d2ff; }
        .mood-tag-item.angry::before { background: #ff453a; }
        .mood-tag-item.calm::before { background: #30d158; }
        .mood-tag-item.excited::before { background: #ff9f0a; }
        .mood-tag-item.bored::before { background: #8e8e93; }

        /* 顶部栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(10, 132, 255, 0.3); }
            50% { box-shadow: 0 0 30px rgba(10, 132, 255, 0.6); }
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 600;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 12px;
            animation: message-in 0.3s ease-out;
        }

        @keyframes message-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #ff9500 0%, #ff6b00 100%);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #30d158 0%, #34c759 100%);
        }

        .message-content {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message.user .message-content {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message.ai .message-bubble {
            background: var(--bubble-ai);
            border-top-left-radius: 6px;
        }

        .message.user .message-bubble {
            background: var(--bubble-user);
            border-top-right-radius: 6px;
        }

        /* 消息时间 */
        .message-time {
            font-size: 11px;
            color: var(--text-tertiary);
            padding: 0 8px;
        }

        /* 情绪动画 */
        .emotion-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .emotion-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: emotion-pulse 1.5s ease-in-out infinite;
        }

        .emotion-dot:nth-child(1) { animation-delay: 0s; }
        .emotion-dot:nth-child(2) { animation-delay: 0.2s; }
        .emotion-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes emotion-pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        .emotion-dot.joy { background: #ffd60a; }
        .emotion-dot.sadness { background: #64d2ff; }
        .emotion-dot.anger { background: #ff453a; }
        .emotion-dot.fear { background: #bf5af2; }
        .emotion-dot.surprise { background: #ff9f0a; }

        /* 打字动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 16px 20px;
            background: var(--bubble-ai);
            border-radius: 20px;
            border-top-left-radius: 6px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing-bounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* 输入区域 */
        .input-container {
            padding: 16px 24px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: var(--bg-tertiary);
            border-radius: 24px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            outline: none;
        }

        #input::placeholder {
            color: var(--text-tertiary);
        }

        .send-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--accent-gradient);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
        }

        /* 侧边栏 */
        .sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            padding: 24px;
            transition: right 0.3s ease;
            z-index: 200;
            overflow-y: auto;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .sidebar-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: var(--accent);
        }

        /* 情绪显示 */
        .emotion-dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .emotion-card {
            background: var(--bg-tertiary);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .emotion-card-icon {
            font-size: 32px;
            margin-bottom: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .emotion-card-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
        }

        .emotion-card-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 覆盖层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 150;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 欢迎画面 */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }

        .welcome-icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            max-width: 300px;
            line-height: 1.6;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header {
                padding: 12px 16px;
            }
            
            .chat-container {
                padding: 16px;
            }
            
            .message-content {
                max-width: 85%;
            }
            
            .input-container {
                padding: 12px 16px 16px;
            }
            
            .sidebar {
                width: 100%;
                right: -100%;
            }
        }

        /* GIF 动画效果 */
        .gif-reaction {
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 24px;
            animation: react-bounce 0.5s ease-out;
        }

        @keyframes react-bounce {
            0% { transform: scale(0) rotate(-20deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* 渐变背景 */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(10, 132, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(94, 92, 230, 0.1) 0%, transparent 50%),
                var(--bg-primary);
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    
    <!-- 左侧情感标签 -->
    <div class="mood-tag" id="moodTag">
        <div class="mood-tag-item joy active" data-mood="joy">轻松</div>
        <div class="mood-tag-item sad" data-mood="sad">难过</div>
        <div class="mood-tag-item angry" data-mood="angry">生气</div>
        <div class="mood-tag-item calm" data-mood="calm">平静</div>
        <div class="mood-tag-item excited" data-mood="excited">兴奋</div>
        <div class="mood-tag-item bored" data-mood="bored">无聊</div>
    </div>
    
    <div class="app">
        <!-- 顶部栏 -->
        <header class="header">
            <div class="header-left">
                <div class="avatar" id="avatar">🦊</div>
                <div class="header-title">
                    <h1>Limbic-Flow</h1>
                    <p id="status-text">在线</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-emotion" title="情绪状态">
                    💭
                </button>
                <button class="icon-btn" id="btn-settings" title="设置">
                    ⚙️
                </button>
            </div>
        </header>
        
        <!-- 聊天区域 -->
        <main class="chat-container" id="chat">
<!-- Welcome screen -->
            <div class="welcome-screen" id="welcome">
                <div class="welcome-icon">🦊</div>
                <h2 class="welcome-title">Hey, it's me</h2>
                <p class="welcome-subtitle">What's on your mind?</p>
            </div>
        </main>
        
        <!-- 输入区域 -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="input" placeholder="发送消息..." rows="1"></textarea>
                <button class="send-btn" id="btn-send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- 覆盖层 -->
        <div class="overlay" id="overlay"></div>
        
        <!-- 设置侧边栏 -->
        <aside class="sidebar" id="sidebar-settings">
            <div class="sidebar-header">
                <h2>设置</h2>
                <button class="close-btn" id="close-settings">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="form-group">
                    <label>人格</label>
                    <select id="personality">
                        <option value="default">默认</option>
                        <option value="gentle">温柔</option>
                        <option value="playful">活泼</option>
                        <option value="wise">智慧</option>
                        <option value="energetic">活力</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>情绪模式</label>
                    <select id="pathology">
                        <option value="none">正常</option>
                        <option value="depression">抑郁</option>
                        <option value="alzheimer">阿尔茨海默</option>
                        <option value="ptsd">PTSD</option>
                        <option value="anxiety">焦虑</option>
                        <option value="bipolar">双相</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>AI 模型</label>
                    <select id="llm-provider">
                        <option value="mock">Mock</option>
                        <option value="openai">OpenAI</option>
                        <option value="deepseek">DeepSeek</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="llm-model" placeholder="模型名称 (如 gpt-4)" />
                </div>
                <div class="form-group">
                    <input type="password" id="llm-api-key" placeholder="API Key" />
                </div>
                <button class="btn-save" id="save-config">保存配置</button>
            </div>
        </aside>
        
        <!-- 情绪侧边栏 -->
        <aside class="sidebar" id="sidebar-emotion">
            <div class="sidebar-header">
                <h2>情绪状态</h2>
                <button class="close-btn" id="close-emotion">&times;</button>
            </div>
            <div class="emotion-dashboard">
                <div class="emotion-card">
                    <div class="emotion-card-icon" id="emotion-icon">😊</div>
                    <div class="emotion-card-value" id="emotion-main">50</div>
                    <div class="emotion-card-label">情绪值</div>
                </div>
                <div class="emotion-card">
                    <div class="emotion-card-icon">⚡</div>
                    <div class="emotion-card-value" id="emotion-arousal">50</div>
                    <div class="emotion-card-label">唤醒度</div>
                </div>
                <div class="emotion-card">
                    <div class="emotion-card-icon">🎯</div>
                    <div class="emotion-card-value" id="emotion-dominance">50</div>
                    <div class="emotion-card-label">控制感</div>
                </div>
                <div class="emotion-card">
                    <div class="emotion-card-icon">🧪</div>
                    <div class="emotion-card-value" id="emotion-dopamine">50</div>
                    <div class="emotion-card-label">多巴胺</div>
                </div>
            </div>
            <div class="emotion-indicator">
                <div class="emotion-dot joy"></div>
                <div class="emotion-dot sadness"></div>
                <div class="emotion-dot anger"></div>
                <div class="emotion-dot fear"></div>
                <div class="emotion-dot surprise"></div>
            </div>
            <button class="btn-reset" id="reset-emotion">重置情绪</button>
        </aside>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
