<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limbic-Flow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- 顶部 -->
        <header class="header">
            <div class="header-title">
                <span class="logo">🧠</span>
                <span class="title">Limbic-Flow</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-settings" title="设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                </button>
                <button class="icon-btn" id="btn-emotion" title="情绪">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                    </svg>
                </button>
            </div>
        </header>
        
        <!-- 聊天区域 -->
        <main class="chat" id="chat">
            <!-- 消息会动态插入这里 -->
        </main>
        
        <!-- 输入区域 -->
        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="input" placeholder="发送消息..." rows="1"></textarea>
                <button id="btn-send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
        
        <!-- 设置侧边栏 -->
        <aside class="sidebar" id="sidebar-settings">
            <div class="sidebar-header">
                <h3>设置</h3>
                <button class="close-btn" id="close-settings">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="form-group">
                    <label>人格</label>
                    <select id="personality">
                        <option value="default">默认</option>
                        <option value="gentle">温柔</option>
                        <option value="playful">活泼</option>
                        <option value="wise">智慧</option>
                        <option value="energetic">活力</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>模式</label>
                    <select id="pathology">
                        <option value="none">正常</option>
                        <option value="depression">抑郁</option>
                        <option value="alzheimer">阿尔茨海默</option>
                        <option value="ptsd">PTSD</option>
                        <option value="hsp">高敏感</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>模型</label>
                    <select id="llm-provider">
                        <option value="mock">Mock</option>
                        <option value="openai">OpenAI</option>
                        <option value="deepseek">DeepSeek</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="llm-model" placeholder="模型名称" />
                </div>
                <div class="form-group">
                    <input type="password" id="llm-api-key" placeholder="API Key" />
                </div>
                <button class="btn-save" id="save-config">保存</button>
            </div>
        </aside>
        
        <!-- 情绪侧边栏 -->
        <aside class="sidebar" id="sidebar-emotion">
            <div class="sidebar-header">
                <h3>情绪状态</h3>
                <button class="close-btn" id="close-emotion">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="emotion-item">
                    <span>愉悦</span>
                    <div class="bar"><div class="fill" id="bar-pleasure"></div></div>
                    <span id="val-pleasure">0</span>
                </div>
                <div class="emotion-item">
                    <span>唤醒</span>
                    <div class="bar"><div class="fill" id="bar-arousal"></div></div>
                    <span id="val-arousal">0</span>
                </div>
                <div class="emotion-item">
                    <span>控制</span>
                    <div class="bar"><div class="fill" id="bar-dominance"></div></div>
                    <span id="val-dominance">0</span>
                </div>
                <div class="emotion-item">
                    <span>多巴胺</span>
                    <div class="bar"><div class="fill dopamine" id="bar-dopamine"></div></div>
                    <span id="val-dopamine">0</span>
                </div>
                <div class="emotion-item">
                    <span>皮质醇</span>
                    <div class="bar"><div class="fill cortisol" id="bar-cortisol"></div></div>
                    <span id="val-cortisol">0</span>
                </div>
                <button class="btn-reset" id="reset-emotion">重置情绪</button>
            </div>
        </aside>
        
        <div class="overlay" id="overlay"></div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
